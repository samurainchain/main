name: Supabase functions

# Deploys the billing functions (web/supabase/functions) to the Supabase project when they
# change on the default branch. Needs the repository secret SUPABASE_ACCESS_TOKEN
# (supabase.com → Account → Access Tokens); without it the job only warns.

on:
  push:
    paths:
      - 'web/supabase/functions/**'
      - 'web/supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vmjyzwrrueoyxcuzpeil
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the functions were not deployed."
            exit 0
          fi
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api
